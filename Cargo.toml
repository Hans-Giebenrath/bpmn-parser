[profile.test]
rustflags = ["-Adead_code", "-Aunused_variables", "-Aunused_imports"]

[profile.nightly]
inherits = "dev"
opt-level = 0
debug = 0
strip = "none"
lto = false
codegen-units = 256
incremental = true
codegen-backend = "cranelift"

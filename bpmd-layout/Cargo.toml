[package]
name = "bpmd-layout"
version = "0.1.0"
edition = "2024"

[dependencies]
good_lp = { version = "1", features = [
    "microlp",
], default-features = false }
bpmd-algorithms = { path = "../bpmd-algorithms" }
bpmd-util = { path = "../bpmd-util" }
bpmd-graph = { path = "../bpmd-graph" }
proc_macros = { path = "../proc_macros" }
itertools = { version = "0.15.0", default-features = false, features = ["use_alloc"] }
cosmic-text = {
    version = "0.19",
    default-features = false,
    features = ["no_std", "swash"],
}
log = "0.4"

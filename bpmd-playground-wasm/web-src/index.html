<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>BPMD Playground</title>
    <link rel="stylesheet" type="text/css" href="fonts.css">
    <link rel="stylesheet" type="text/css" href="visibility-table.css">
    <link rel="stylesheet" type="text/css" href="editor.css">
    <link rel="stylesheet" type="text/css" href="svg.css">
  </head>
  <body style="display: flex; gap: 1em">
      <div>
          <h1 id="title">BPMD Playground</h1>
          <div id="editor-container" style="width: 80ch; height: 40em;">
              <!--
                  Underlines, or maybe even background colors, are rendered in this pre.
                  Reason is that `#mirror-editor` is supposed to be updated quickly, but layouting
                  can take some time. So to not block highlighting newest syntax with waiting for
                  a successful layout run, `#mirror-editor` is updated by another process, and
                  `#diagnostics-pane` is updated when the layouting run is done.

              -->
              <pre id="diagnostics-pane" style="white-space: pre"></pre>
              <!--  -->
              <pre id="mirror-editor" style="white-space: pre"></pre>
              <textarea id="editor" style="width: 100%" rows="40"></textarea>
          </div>
      </div>
      <div style="flex-direction: column; gap: 1em; ">
          <div id="diagram" style="width: 55em;"></div>
          <div id="vistab"></div>
      <div>
      <div id="diagnostics" style="white-space: pre; font-family: mono; font-size: 0.8em;"></div>
  </body>
  <script type="module" src="./main.js" ></script>
</html>
